services:
  pix-collaboration-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: pix-collaboration-mcp:latest
    container_name: pix-collaboration-mcp
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - REDMINE_BASE_URL=https://rd.pixmoving.city
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
